<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360">
  <defs>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0033"/>
      <stop offset="40%" stop-color="#4b0082"/>
      <stop offset="100%" stop-color="#9b30ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" fill="#0a0a12"/>

  <!-- Title -->
  <text x="24" y="30" fill="#c080ff" font-family="sans-serif" font-size="17" font-weight="bold">TMDrake Tail Schematic (9 LEDs)</text>

  <!-- Belt / body reference (left) -->
  <rect x="6" y="105" width="26" height="150" rx="3" fill="#1e1e2e" stroke="#555577" stroke-width="1.5"/>
  <text x="19" y="185" fill="#777799" font-family="sans-serif" font-size="10" text-anchor="middle" transform="rotate(-90 19 185)">BELT</text>

  <!-- Tail body: base (left) thicker / flush, tapering to tip (right) -->
  <path d="M32,125
           C80,108 140,100 220,98
           C340,95 480,100 620,120
           C740,138 840,165 920,195
           L920,210
           C840,185 740,165 620,155
           C480,145 340,150 220,155
           C140,158 80,165 32,185
           Z"
        fill="url(#tailGrad)" stroke="#c080ff" stroke-width="2.5"/>

  <!-- Base zone (flush) -->
  <text x="55" y="255" fill="#b0b0d0" font-family="sans-serif" font-size="13" font-weight="bold">BASE</text>
  <text x="55" y="272" fill="#8080a0" font-family="sans-serif" font-size="11">flush to body / belt</text>

  <!-- Tip label -->
  <text x="870" y="255" fill="#b0b0d0" font-family="sans-serif" font-size="13" font-weight="bold">TIP</text>
  <text x="830" y="272" fill="#8080a0" font-family="sans-serif" font-size="11">free end</text>

  <!-- 7 uniform dorsal spikes along the spline -->
  <polygon points="175,98 188,48 201,98" fill="#d0a0ff" stroke="#ffffff" stroke-width="1.2"/>
  <polygon points="275,95 288,42 301,95" fill="#d0a0ff" stroke="#ffffff" stroke-width="1.2"/>
  <polygon points="380,97 393,44 406,97" fill="#d0a0ff" stroke="#ffffff" stroke-width="1.2"/>
  <polygon points="485,105 498,52 511,105" fill="#d0a0ff" stroke="#ffffff" stroke-width="1.2"/>
  <polygon points="585,118 598,65 611,118" fill="#d0a0ff" stroke="#ffffff" stroke-width="1.2"/>
  <polygon points="680,138 693,85 706,138" fill="#d0a0ff" stroke="#ffffff" stroke-width="1.2"/>
  <polygon points="770,158 783,105 796,158" fill="#d0a0ff" stroke="#ffffff" stroke-width="1.2"/>

  <!-- 2 side horns (turquoise) sticking out the sides near base -->
  <polygon points="95,118 70,85 115,108" fill="#40e0d0" stroke="#ffffff" stroke-width="1.3"/>
  <polygon points="95,192 70,225 115,200" fill="#40e0d0" stroke="#ffffff" stroke-width="1.3"/>

  <!-- 9 LED positions: 7 magenta on dorsal spikes + 2 cyan on side horns -->
  <circle cx="188" cy="58" r="6" fill="#ff00ff" stroke="#fff" stroke-width="1.2"/>
  <circle cx="288" cy="52" r="6" fill="#ff00ff" stroke="#fff" stroke-width="1.2"/>
  <circle cx="393" cy="54" r="6" fill="#ff00ff" stroke="#fff" stroke-width="1.2"/>
  <circle cx="498" cy="62" r="6" fill="#ff00ff" stroke="#fff" stroke-width="1.2"/>
  <circle cx="598" cy="75" r="6" fill="#ff00ff" stroke="#fff" stroke-width="1.2"/>
  <circle cx="693" cy="95" r="6" fill="#ff00ff" stroke="#fff" stroke-width="1.2"/>
  <circle cx="783" cy="115" r="6" fill="#ff00ff" stroke="#fff" stroke-width="1.2"/>

  <!-- Side-horn LEDs (turquoise matching the horns) -->
  <circle cx="85" cy="100" r="5.5" fill="#00ffff" stroke="#fff" stroke-width="1.2"/>
  <circle cx="85" cy="210" r="5.5" fill="#00ffff" stroke="#fff" stroke-width="1.2"/>

  <!-- Legend -->
  <text x="24" y="310" fill="#c080ff" font-family="sans-serif" font-size="13">7 uniform dorsal spikes (magenta LEDs) + 2 side horns (turquoise)</text>
  <text x="24" y="330" fill="#a0a0c0" font-family="sans-serif" font-size="12">Base (left) sits flush against the body at the belt · Tip (right) is the free end</text>
  <text x="24" y="348" fill="#8080a0" font-family="sans-serif" font-size="11">9× WS2812B · ESP32 + WLED · Designed to flip inside-out</text>
</svg>
