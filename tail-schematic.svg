<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720">
  <defs>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0033"/>
      <stop offset="40%" stop-color="#4b0082"/>
      <stop offset="100%" stop-color="#9b30ff"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a0055"/>
      <stop offset="50%" stop-color="#5a00a0"/>
      <stop offset="100%" stop-color="#9b30ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="980" height="720" fill="#0a0a12"/>

  <!-- ========== TITLE ========== -->
  <text x="24" y="28" fill="#c080ff" font-family="sans-serif" font-size="18" font-weight="bold">TMDrake Tail Schematic — Dual View (9 LEDs)</text>
  <text x="24" y="48" fill="#8080a0" font-family="sans-serif" font-size="12">Orthographic side + top · Base flush at belt · 7 uniform dorsal spikes + 2 turquoise side horns at tip</text>

  <!-- ========== SIDE VIEW ========== -->
  <text x="24" y="85" fill="#e0c0ff" font-family="sans-serif" font-size="14" font-weight="bold">SIDE VIEW</text>

  <!-- Belt block -->
  <rect x="10" y="130" width="24" height="130" rx="3" fill="#1e1e2e" stroke="#555577" stroke-width="1.5"/>
  <text x="22" y="200" fill="#777799" font-family="sans-serif" font-size="10" text-anchor="middle" transform="rotate(-90 22 200)">BELT</text>

  <!-- Tail body (side) -->
  <path d="M34,145
           C85,125 150,118 230,116
           C350,113 490,118 630,140
           C740,158 840,185 920,210
           L920,225
           C840,205 740,185 630,175
           C490,160 350,162 230,165
           C150,167 85,175 34,195
           Z"
        fill="url(#tailGrad)" stroke="#c080ff" stroke-width="2.5"/>

  <!-- Base / Tip labels (side) -->
  <text x="50" y="280" fill="#b0b0d0" font-family="sans-serif" font-size="13" font-weight="bold">BASE</text>
  <text x="50" y="296" fill="#8080a0" font-family="sans-serif" font-size="11">flush to body / belt</text>
  <text x="870" y="280" fill="#b0b0d0" font-family="sans-serif" font-size="13" font-weight="bold">TIP</text>
  <text x="830" y="296" fill="#8080a0" font-family="sans-serif" font-size="11">free end + side horns</text>

  <!-- 7 uniform dorsal spikes (side) -->
  <polygon points="185,116 198,66 211,116" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>
  <polygon points="285,114 298,62 311,114" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>
  <polygon points="390,116 403,64 416,116" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>
  <polygon points="495,125 508,72 521,125" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>
  <polygon points="595,140 608,87 621,140" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>
  <polygon points="690,160 703,107 716,160" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>
  <polygon points="780,180 793,127 806,180" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>

  <!-- 2 side horns (turquoise) at TIP end, angled outward -->
  <polygon points="860,195 900,155 880,210" fill="#40e0d0" stroke="#fff" stroke-width="1.4"/>
  <polygon points="860,240 900,280 880,225" fill="#40e0d0" stroke="#fff" stroke-width="1.4"/>

  <!-- LEDs side view: 7 magenta dorsal + 2 cyan side at tip -->
  <circle cx="198" cy="76" r="5.5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="298" cy="72" r="5.5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="403" cy="74" r="5.5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="508" cy="82" r="5.5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="608" cy="97" r="5.5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="703" cy="117" r="5.5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="793" cy="137" r="5.5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="885" cy="175" r="5.5" fill="#00ffff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="885" cy="255" r="5.5" fill="#00ffff" stroke="#fff" stroke-width="1.1"/>

  <!-- ========== TOP VIEW ========== -->
  <text x="24" y="350" fill="#e0c0ff" font-family="sans-serif" font-size="14" font-weight="bold">TOP VIEW</text>
  <text x="120" y="350" fill="#8080a0" font-family="sans-serif" font-size="11">(looking down from above)</text>

  <!-- Tail body (top) - elongated oval tapering to tip -->
  <path d="M50,480
           C80,430 160,410 280,405
           C420,400 560,410 700,440
           C800,460 880,500 930,530
           C880,560 800,580 700,580
           C560,590 420,580 280,575
           C160,570 80,550 50,500
           Z"
        fill="url(#topGrad)" stroke="#c080ff" stroke-width="2.5"/>

  <!-- Centerline (dorsal spline) -->
  <line x1="70" y1="490" x2="910" y2="530" stroke="#a060ff" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- 7 uniform dorsal spikes (top view) -->
  <polygon points="200,490 210,470 220,490 210,505" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="300,485 310,465 320,485 310,500" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="400,482 410,462 420,482 410,497" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="500,485 510,465 520,485 510,500" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="600,495 610,475 620,495 610,510" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="700,510 710,490 720,510 710,525" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="800,525 810,505 820,525 810,540" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>

  <!-- 2 side horns (turquoise) at TIP, sticking out left & right -->
  <polygon points="900,500 945,470 920,520" fill="#40e0d0" stroke="#fff" stroke-width="1.4"/>
  <polygon points="900,555 945,585 920,540" fill="#40e0d0" stroke="#fff" stroke-width="1.4"/>

  <!-- LEDs top view -->
  <circle cx="210" cy="485" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="310" cy="480" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="410" cy="477" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="510" cy="480" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="610" cy="490" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="710" cy="505" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="810" cy="520" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="925" cy="490" r="5.5" fill="#00ffff" stroke="#fff" stroke-width="1"/>
  <circle cx="925" cy="565" r="5.5" fill="#00ffff" stroke="#fff" stroke-width="1"/>

  <!-- Base / Tip labels (top) -->
  <text x="55" y="620" fill="#b0b0d0" font-family="sans-serif" font-size="13" font-weight="bold">BASE</text>
  <text x="55" y="636" fill="#8080a0" font-family="sans-serif" font-size="11">belt end (flush)</text>
  <text x="870" y="620" fill="#b0b0d0" font-family="sans-serif" font-size="13" font-weight="bold">TIP</text>
  <text x="820" y="636" fill="#8080a0" font-family="sans-serif" font-size="11">free end + side horns</text>

  <!-- Legend -->
  <rect x="20" y="660" width="940" height="45" rx="4" fill="#12121c" stroke="#333355" stroke-width="1"/>
  <circle cx="45" cy="682" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <text x="58" y="686" fill="#c0c0e0" font-family="sans-serif" font-size="12">Dorsal LEDs (7)</text>
  <circle cx="180" cy="682" r="5" fill="#00ffff" stroke="#fff" stroke-width="1"/>
  <text x="193" y="686" fill="#c0c0e0" font-family="sans-serif" font-size="12">Side-horn LEDs (2) at tip</text>
  <polygon points="370,675 380,665 390,675 380,685" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <text x="400" y="686" fill="#c0c0e0" font-family="sans-serif" font-size="12">Dorsal spikes (uniform)</text>
  <polygon points="560,675 540,665 565,682" fill="#40e0d0" stroke="#fff" stroke-width="1"/>
  <text x="575" y="686" fill="#c0c0e0" font-family="sans-serif" font-size="12">Side horns at tip (turquoise)</text>
  <text x="780" y="686" fill="#8080a0" font-family="sans-serif" font-size="11">ESP32 + WLED · Orthographic</text>
</svg>
