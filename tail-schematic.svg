<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720">
  <defs>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0033"/>
      <stop offset="40%" stop-color="#4b0082"/>
      <stop offset="100%" stop-color="#9b30ff"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a0055"/>
      <stop offset="50%" stop-color="#5a00a0"/>
      <stop offset="100%" stop-color="#9b30ff"/>
    </linearGradient>
  </defs>

  <rect width="980" height="720" fill="#0a0a12"/>

  <text x="24" y="28" fill="#c080ff" font-family="sans-serif" font-size="18" font-weight="bold">TMDrake Tail Schematic — Dual View (11 spikes / 11 LEDs)</text>
  <text x="24" y="48" fill="#8080a0" font-family="sans-serif" font-size="12">Orthographic side + top · Base flush at belt · 9 uniform dorsal spikes + 2 turquoise side horns at tip</text>

  <!-- SIDE VIEW -->
  <text x="24" y="85" fill="#e0c0ff" font-family="sans-serif" font-size="14" font-weight="bold">SIDE VIEW</text>

  <rect x="10" y="115" width="24" height="160" rx="3" fill="#1e1e2e" stroke="#555577" stroke-width="1.5"/>
  <text x="22" y="200" fill="#777799" font-family="sans-serif" font-size="10" text-anchor="middle" transform="rotate(-90 22 200)">BELT</text>

  <!-- Thicker tail body -->
  <path d="M34,125
           C90,100 160,95 250,95
           C380,95 520,110 650,140
           C760,165 860,195 925,220
           L925,250
           C860,235 760,215 650,200
           C520,185 380,190 250,200
           C160,205 90,215 34,245
           Z"
        fill="url(#tailGrad)" stroke="#c080ff" stroke-width="2.5"/>

  <text x="50" y="290" fill="#b0b0d0" font-family="sans-serif" font-size="13" font-weight="bold">BASE</text>
  <text x="50" y="306" fill="#8080a0" font-family="sans-serif" font-size="11">flush to body / belt</text>
  <text x="870" y="290" fill="#b0b0d0" font-family="sans-serif" font-size="13" font-weight="bold">TIP</text>
  <text x="820" y="306" fill="#8080a0" font-family="sans-serif" font-size="11">free end + side horns</text>

  <!-- 9 uniform dorsal spikes -->
  <polygon points="160,95 173,45 186,95" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>
  <polygon points="240,95 253,42 266,95" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>
  <polygon points="320,96 333,43 346,96" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>
  <polygon points="400,100 413,47 426,100" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>
  <polygon points="485,112 498,59 511,112" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>
  <polygon points="570,128 583,75 596,128" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>
  <polygon points="655,148 668,95 681,148" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>
  <polygon points="735,168 748,115 761,168" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>
  <polygon points="810,190 823,137 836,190" fill="#d0a0ff" stroke="#fff" stroke-width="1.2"/>

  <!-- 2 side horns at tip -->
  <polygon points="870,210 920,165 895,230" fill="#40e0d0" stroke="#fff" stroke-width="1.4"/>
  <polygon points="870,260 920,305 895,245" fill="#40e0d0" stroke="#fff" stroke-width="1.4"/>

  <!-- 11 LEDs: 9 dorsal + 2 side -->
  <circle cx="173" cy="55" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="253" cy="52" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="333" cy="53" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="413" cy="57" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="498" cy="69" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="583" cy="85" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="668" cy="105" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="748" cy="125" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="823" cy="147" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="900" cy="185" r="5.5" fill="#00ffff" stroke="#fff" stroke-width="1.1"/>
  <circle cx="900" cy="285" r="5.5" fill="#00ffff" stroke="#fff" stroke-width="1.1"/>

  <!-- TOP VIEW -->
  <text x="24" y="350" fill="#e0c0ff" font-family="sans-serif" font-size="14" font-weight="bold">TOP VIEW</text>
  <text x="120" y="350" fill="#8080a0" font-family="sans-serif" font-size="11">(looking down from above)</text>

  <path d="M50,480
           C80,430 160,410 280,405
           C420,400 560,410 700,440
           C800,460 880,500 930,530
           C880,560 800,580 700,580
           C560,590 420,580 280,575
           C160,570 80,550 50,500
           Z"
        fill="url(#topGrad)" stroke="#c080ff" stroke-width="2.5"/>

  <line x1="70" y1="490" x2="910" y2="530" stroke="#a060ff" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- 9 dorsal spikes top -->
  <polygon points="160,488 170,468 180,488 170,503" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="240,483 250,463 260,483 250,498" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="320,480 330,460 340,480 330,495" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="400,480 410,460 420,480 410,495" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="490,485 500,465 510,485 500,500" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="580,495 590,475 600,495 590,510" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="670,508 680,488 690,508 680,523" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="750,520 760,500 770,520 760,535" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="820,528 830,508 840,528 830,543" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>

  <!-- 2 side horns at tip -->
  <polygon points="900,500 945,470 920,520" fill="#40e0d0" stroke="#fff" stroke-width="1.4"/>
  <polygon points="900,555 945,585 920,540" fill="#40e0d0" stroke="#fff" stroke-width="1.4"/>

  <!-- LEDs top -->
  <circle cx="170" cy="483" r="4.5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="250" cy="478" r="4.5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="330" cy="475" r="4.5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="410" cy="475" r="4.5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="500" cy="480" r="4.5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="590" cy="490" r="4.5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="680" cy="503" r="4.5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="760" cy="515" r="4.5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="830" cy="523" r="4.5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="925" cy="490" r="5.5" fill="#00ffff" stroke="#fff" stroke-width="1"/>
  <circle cx="925" cy="565" r="5.5" fill="#00ffff" stroke="#fff" stroke-width="1"/>

  <text x="55" y="620" fill="#b0b0d0" font-family="sans-serif" font-size="13" font-weight="bold">BASE</text>
  <text x="55" y="636" fill="#8080a0" font-family="sans-serif" font-size="11">belt end (flush)</text>
  <text x="870" y="620" fill="#b0b0d0" font-family="sans-serif" font-size="13" font-weight="bold">TIP</text>
  <text x="820" y="636" fill="#8080a0" font-family="sans-serif" font-size="11">free end + side horns</text>

  <rect x="20" y="660" width="940" height="45" rx="4" fill="#12121c" stroke="#333355" stroke-width="1"/>
  <circle cx="45" cy="682" r="5" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <text x="58" y="686" fill="#c0c0e0" font-family="sans-serif" font-size="12">Dorsal LEDs (9)</text>
  <circle cx="180" cy="682" r="5" fill="#00ffff" stroke="#fff" stroke-width="1"/>
  <text x="193" y="686" fill="#c0c0e0" font-family="sans-serif" font-size="12">Side-horn LEDs (2) at tip</text>
  <polygon points="380,675 390,665 400,675 390,685" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <text x="410" y="686" fill="#c0c0e0" font-family="sans-serif" font-size="12">Dorsal spikes (9)</text>
  <polygon points="545,675 525,665 550,682" fill="#40e0d0" stroke="#fff" stroke-width="1"/>
  <text x="560" y="686" fill="#c0c0e0" font-family="sans-serif" font-size="12">Side horns at tip (2) · Total 11 spikes</text>
  <text x="800" y="686" fill="#8080a0" font-family="sans-serif" font-size="11">ESP32 + WLED</text>
</svg>
