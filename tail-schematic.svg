<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d0055"/>
      <stop offset="50%" stop-color="#6b00b3"/>
      <stop offset="100%" stop-color="#9b30ff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="900" height="320" fill="#0a0a12"/>
  <!-- Tail body (side view, tapering) -->
  <path d="M40,160 C120,90 280,70 450,95 C620,120 780,150 860,175 L860,195 C780,180 620,160 450,145 C280,130 120,150 40,200 Z" fill="url(#tailGrad)" stroke="#c080ff" stroke-width="2"/>
  <!-- 7 dorsal spikes -->
  <polygon points="140,95 155,40 170,95" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="230,80 245,25 260,80" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="320,75 335,20 350,75" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="410,85 425,30 440,85" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="500,95 515,40 530,95" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="590,110 605,55 620,110" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="680,125 695,70 710,125" fill="#d0a0ff" stroke="#fff" stroke-width="1"/>
  <!-- 2 side horns (near base) -->
  <polygon points="90,130 70,100 110,120" fill="#e0b0ff" stroke="#fff" stroke-width="1"/>
  <polygon points="90,190 70,220 110,200" fill="#e0b0ff" stroke="#fff" stroke-width="1"/>
  <!-- LED positions (9 total: 7 spikes + 2 horns) -->
  <circle cx="155" cy="55" r="6" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="245" cy="40" r="6" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="335" cy="35" r="6" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="425" cy="45" r="6" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="515" cy="55" r="6" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="605" cy="70" r="6" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="695" cy="85" r="6" fill="#ff00ff" stroke="#fff" stroke-width="1"/>
  <circle cx="85" cy="110" r="5" fill="#00ffff" stroke="#fff" stroke-width="1"/>
  <circle cx="85" cy="210" r="5" fill="#00ffff" stroke="#fff" stroke-width="1"/>
  <!-- Labels -->
  <text x="20" y="30" fill="#c080ff" font-family="sans-serif" font-size="16" font-weight="bold">TMDrake Tail Schematic (9 LEDs)</text>
  <text x="20" y="280" fill="#a0a0c0" font-family="sans-serif" font-size="12">7 dorsal spikes + 2 side horns · WS2812B · ESP32 + WLED</text>
  <text x="20" y="300" fill="#8080a0" font-family="sans-serif" font-size="11">Base attaches at left · Tip at right · Designed to flip inside-out</text>
</svg>